spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: WARN
    com.apargo.waba: INFO


cors:
  # comma seprated
  allowed-origins: ${CORS_ALLOWED_ORIGINS}